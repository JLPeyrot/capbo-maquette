<h2 mat-dialog-title>{{ showTrunkSelection ? 'Ajouter à un tronc' : 'Choisir le niveau d\'affectation' }}</h2>

<div mat-dialog-content class="dialog-content">
  <p class="selection-info">Articles sélectionnés: {{ data.selectedCount }}</p>

  <mat-form-field appearance="outline" class="full-width" *ngIf="showTrunkSelection">
    <mat-label>Tronc</mat-label>
    <mat-select [(ngModel)]="selectedTrunkId" placeholder="Choisir un tronc">
      <mat-option *ngFor="let trunk of trunks" [value]="trunk.id">
        {{ trunk.name }} ({{ trunk.type }})
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Niveau du tronc</mat-label>
    <mat-select [(ngModel)]="selectedLevel" placeholder="Choisir un niveau">
      <mat-option *ngFor="let level of levels" [value]="level">
        Niveau {{ level }} <span class="level-label">(<em>{{ getLevelLabel(level) }}</em>)</span>
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width" *ngIf="showTypologySelection">
    <mat-label>Typologie de déploiement</mat-label>
    <mat-select [(ngModel)]="selectedDeploymentTypology">
      <mat-option value="ferme">Fermé</mat-option>
      <mat-option value="mixte">Mixte</mat-option>
      <mat-option value="ouvert">Ouvert</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" class="orange-action" [disabled]="(showTrunkSelection && !selectedTrunkId) || !selectedLevel" (click)="onConfirm()">
    Confirmer
  </button>
</div>
