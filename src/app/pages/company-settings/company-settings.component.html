<div class="company-settings-page">
  <div class="page-header">
    <h1>Paramétrage entreprise</h1>
  </div>

  <mat-card class="company-card">
    <mat-card-header>
      <mat-card-title>Gestion des superficie magasin</mat-card-title>
      <button mat-icon-button class="add-slider-btn" (click)="addSlider()">
        <mat-icon>add</mat-icon>
      </button>
    </mat-card-header>
    <mat-card-content>
      <div class="multi-slider">
        <div class="slider-row">
          <div class="bound bound-min">{{ min }} m2</div>
          <div class="custom-slider" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp()" (pointerleave)="onPointerUp()">
            <div class="thumb-values">
              <div class="thumb-value" *ngFor="let s of sliders" [style.left.%]="getPercent(s.value)">{{ s.value }} m²</div>
            </div>
            <div #track class="slider-track"></div>
            <div class="slider-handle" *ngFor="let s of sliders; let i = index" [style.left.%]="getPercent(s.value)" (pointerdown)="onHandleDown(i, $event)"></div>
          </div>
        </div>
        <div class="values-table">
          <div class="value-row">
            <mat-form-field appearance="outline" class="value-field">
              <input matInput type="number" [value]="min" disabled>
              <span matTextSuffix>m²</span>
            </mat-form-field>
            <mat-form-field appearance="outline" class="name-field">
              <input matInput type="text" placeholder="Nom" [(ngModel)]="defaultMaxName">
            </mat-form-field>
          </div>
          <div class="value-row" *ngFor="let s of sliders; let i = index">
            <mat-form-field appearance="outline" class="value-field">
              <input matInput type="number" [min]="min" [max]="max" [step]="step" [(ngModel)]="sliders[i].value" (ngModelChange)="onValueChange(i, $event)">
              <span matTextSuffix>m²</span>
            </mat-form-field>
            <mat-form-field appearance="outline" class="name-field">
              <input matInput type="text" placeholder="Nom" [(ngModel)]="sliders[i].name">
            </mat-form-field>
            <button mat-icon-button class="delete-btn" (click)="removeSlider(i)" aria-label="Supprimer">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-flat-button color="primary" (click)="saveSettings()">Enregistrer</button>
    </mat-card-actions>
  </mat-card>
</div>
