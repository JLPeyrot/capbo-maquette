<div class="suppliers-container">
  <!-- Header -->
  <div class="page-header">
    <div class="header-content">
      <h1>
        <mat-icon>business</mat-icon>
        Gestion des Fournisseurs
      </h1>
      <p class="subtitle">Gérez vos fournisseurs et leurs informations</p>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="addSupplier()">
        <mat-icon>add</mat-icon>
        Nouveau Fournisseur
      </button>
    </div>
  </div>

  <!-- Filters and Search -->
  <mat-card class="filters-card">
    <mat-card-content>
      <div class="filters-row">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Rechercher un fournisseur</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput placeholder="Nom, email, téléphone...">
        </mat-form-field>
        
        <mat-form-field appearance="outline">
          <mat-label>Statut</mat-label>
          <mat-select>
            <mat-option value="all">Tous</mat-option>
            <mat-option value="active">Actifs</mat-option>
            <mat-option value="inactive">Inactifs</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Suppliers Table -->
  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="suppliers" class="suppliers-table">
          
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nom du Fournisseur</th>
            <td mat-cell *matCellDef="let supplier">
              <div class="supplier-info">
                <div class="supplier-name">{{supplier.name}}</div>
              </div>
            </td>
          </ng-container>

          <!-- Contact Column -->
          <ng-container matColumnDef="contact">
            <th mat-header-cell *matHeaderCellDef>Contact</th>
            <td mat-cell *matCellDef="let supplier">
              <div class="contact-info">
                <div class="email">{{supplier.contact}}</div>
              </div>
            </td>
          </ng-container>

          <!-- Phone Column -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Téléphone</th>
            <td mat-cell *matCellDef="let supplier">{{supplier.phone}}</td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Statut</th>
            <td mat-cell *matCellDef="let supplier">
              <span [ngClass]="supplier.status === 'Actif' ? 'status-active' : 'status-inactive'" class="status-chip">
                {{supplier.status}}
              </span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let supplier">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="editSupplier(supplier)">
                  <mat-icon>edit</mat-icon>
                  <span>Modifier</span>
                </button>
                <button mat-menu-item (click)="deleteSupplier(supplier)">
                  <mat-icon>delete</mat-icon>
                  <span>Supprimer</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
