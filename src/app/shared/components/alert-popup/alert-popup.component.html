<div class="alert-overlay">
  <div class="alert-popup">
    
    <!-- Header avec icône et titre -->
    <div class="alert-header">
      <mat-icon class="alert-icon" [style.color]="getIconColor()">
        {{ getIcon() }}
      </mat-icon>
      <h2 class="alert-title">{{ data.title }}</h2>
      <button mat-icon-button class="close-btn" (click)="onClose()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Contenu du message -->
    <div class="alert-content">
      <p class="alert-message">{{ data.message }}</p>
    </div>

    <!-- Footer avec actions -->
    <div class="alert-footer">
      
      <!-- Checkbox "Ne plus afficher" (optionnel) -->
      <div class="dont-show-again" *ngIf="data.showDontShowAgain">
        <mat-checkbox [(ngModel)]="dontShowAgainChecked">
          Ne plus afficher cette alerte
        </mat-checkbox>
      </div>

      <!-- Boutons d'action -->
      <div class="alert-actions">
        <button mat-button (click)="onClose()" class="cancel-btn">
          Plus tard
        </button>
        <button mat-raised-button 
                color="primary" 
                (click)="onDontShowAgain()"
                class="ok-btn">
          J'ai compris
        </button>
      </div>
      
    </div>

  </div>
</div>
